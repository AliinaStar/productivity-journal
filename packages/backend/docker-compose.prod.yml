# Production compose: DB stays internal, API is fronted by Caddy with
# automatic HTTPS. Run on the server with:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: litopys_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-reporting_system}
    # No ports published: the database is reachable only on the internal
    # Docker network, never from the public internet.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: litopys_api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # Exposed only to other containers (Caddy), not to the host/internet.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: ./backup
    container_name: litopys_backup
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      # A host bind mount, deliberately NOT a named volume: `docker compose
      # down -v` deletes named volumes, which would wipe the backups in the
      # exact accident they exist to undo. Point BACKUP_DIR at a path on an
      # encrypted disk (see README "Encryption at rest").
      - ${BACKUP_DIR:-/var/backups/litopys}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: litopys_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  # In production, ensure the host disk backing this volume is encrypted at
  # rest (LUKS / encrypted block storage) — see README "Encryption at rest".
  postgres_data:
  caddy_data:
  caddy_config:
