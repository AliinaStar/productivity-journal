services:
  db:
    image: pgvector/pgvector:pg17
    container_name: bcr_data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-reporting_system}
    # Exposed for local development only. In production, do NOT publish the DB
    # port — keep it on the internal Docker network and override via a
    # docker-compose.prod.yml or by removing this mapping.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bcr_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  # In production, ensure the host disk backing this volume is encrypted at
  # rest (LUKS / encrypted block storage) — see README "Encryption at rest".
  postgres_data:
